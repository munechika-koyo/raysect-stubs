[project]
name = "raysect-stubs"
description = "Typing Stubs for Raysect"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [
  { name = "Koyo Munechika", email = "munechika.koyo@gmail.com" },
]
keywords = ["mypy", "ray-tracing", "raysect", "type-stubs"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Stubs Only",
]
dependencies = ["numpy", 'typing-extensions>=4.6; python_version < "3.12"']
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/munechika-koyo/raysect-stubs"
Issues = "https://github.com/munechika-koyo/raysect-stubs/issues"
Repository = "https://github.com/munechika-koyo/raysect-stubs"

[build-system]
requires = ["hatch-vcs", "hatchling"]
build-backend = "hatchling.build"

# ----------------------
# === Version config ===
# ----------------------
[tool.hatch.version]
source = "vcs"

[tool.hatch.metadata.hooks.vcs]

# ----------------------------
# === Build/Package config ===
# ----------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/raysect-stubs"]

# ------------------------------
# === Type checking settings ===
# ------------------------------
[tool.mypy]
strict = true
warn_unreachable = false

[tool.pyrefly]
project-includes = ["src"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_functions = ["test_*"]
testpaths = ["tests"]

# ------------------------------
# === Lint & Format settings ===
# ------------------------------
[tool.ruff]
line-length = 200
include = ["*.py", "*.pyi"]

[tool.ruff.format]
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
]
ignore = [
  "E501",  # line too long, handled by formatter
  "F403",  # 'from module import *' used; unable to detect undefined names
]

[tool.ruff.lint.isort]
known-first-party = ["raysect"]
split-on-trailing-comma = false

[tool.tombi]
toml-version = "v1.1.0"

[tool.typos.default.extend-words]
writeable = "writeable"
