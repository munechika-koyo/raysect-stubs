[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]
preview = ["pixi-build"]

# -------------------------------
# === Packaging Configuration ===
# -------------------------------
[package]
version = "dynamic"  # Until pixi recommends something else

[package.build]
backend = { name = "pixi-build-python", version = "*" }

[package.build.config]
noarch = true

[package.host-dependencies]
python = ">=3.10"
hatchling = "*"
hatch-vcs = "*"

[package.run-dependencies]
numpy = "*"
typing-extensions = { version = ">=4.6", when = "python <3.12" }

[package.run-constraints]
raysect = ">=0.9.0,<0.10.0"

# ---------------------------------
# === Development Configuration ===
# ---------------------------------
[dependencies]
raysect-stubs = { path = "." }
raysect = "*"
pytest = "*"
mypy = "*"
ipython = ">=8.37.0,<10"

[tasks]
# Testing and type checking
type-check = "mypy raysect-stubs/"

# Type stub generation
typegen = {
  cmd = [
    "stubgen",
    "-p",
    "raysect",
    "-o",
    "stubgen_temp",
    "--ignore-errors",
    "--include-private",
    "--include-docstrings",
  ],
  description = "📝 Generate type stubs for raysect"
}

[feature.test.dependencies]
mypy = "*"
pytest = "*"
raysect = "*"

[feature.test.pypi-dependencies]
raysect-stubs = { path = ".", editable = false }

[feature.test.tasks]
test-regression = {
  cmd = "pytest -q tests/test_stubs.py",
  description = "Run regression tests for the stubs",
}
test-stubtest = {
  cmd = "stubtest --allowlist=.mypyignore --ignore-disjoint-bases raysect",
  description = "Check stubs against the Raysect runtime",
}
test = {
  depends-on = [
    "test-regression",
    "test-stubtest",
  ],
  description = "Run all stub tests"
}

# === Linting feature ===
[feature.lint.dependencies]
dprint = "*"
lefthook = ">=2.1.9,<3"
ruff = "*"
typos = "*"
mypy = "*"
pyrefly = "*"
actionlint = "*"
shellcheck = "*"
validate-pyproject = "*"
blacken-docs = "*"
tombi = "*"

[feature.lint.tasks]
lefthook = { cmd = "lefthook", description = "🔗 Run lefthook" }
hooks = { cmd = "lefthook install", description = "🔗 Install pre-commit hooks" }
pre-commit = { cmd = "lefthook run pre-commit", description = "🔗 Run pre-commit checks" }
mypy = { cmd = "mypy", description = "Type check with mypy" }
pyrefly-check = { cmd = "pyrefly check", description = "Type check with pyrefly" }
ruff-check = { cmd = "ruff check --fix", description = "Lint with ruff" }
ruff-format = { cmd = "ruff format", description = "Format with ruff" }
toml-format = { cmd = "tombi format", description = "Format TOML files" }
dprint = { cmd = "dprint fmt", description = "Format with dprint" }
typos = { cmd = "typos --write-changes --force-exclude", description = "Fix typos" }
actionlint = { cmd = "actionlint", description = "Lint actions with actionlint" }
blacken-docs = { cmd = "blacken-docs", description = "Format Python markdown blocks with Black" }
validate-pyproject = { cmd = "validate-pyproject pyproject.toml", description = "Validate pyproject.toml" }
lint = { cmd = "lefthook run pre-commit --all-files --force", description = "🧹 Run all linters" }

[feature.tools.tasks]
typegen-update = {
  cmd = [
    "rm",
    "-rf",
    "src/raysect-stubs/*",
    "&&",
    "mv",
    "stubgen_temp/raysect/*",
    "src/raysect-stubs/",
  ],
  description = "📝 Update type stubs for raysect"
}

# === Build feature ===
[feature.build.dependencies]
python-build = "*"

[feature.build.dev]
raysect-stubs = { path = "." }

[feature.build.tasks]
build-wheel = {
  cmd = "python -m build -nx -w",
  description = "🔧 Build wheel distribution",
}
build-sdist = {
  cmd = "python -m build -nx -s",
  description = "🔧 Build source distribution",
}

# === Python environment features ===
[feature.py-oldest.dependencies]
python = "3.10.*"

[feature.py-latest.dependencies]
python = "3.14.*"

[environments]
default = { features = ["py-latest"], solve-group = "py-latest" }
py-latest = { features = ["py-latest"], solve-group = "py-latest" }
py-oldest = { features = ["py-oldest"], solve-group = "py-oldest" }
test = { features = ["test"], no-default-feature = true }
test-pylatest = { features = ["test", "py-latest"], no-default-feature = true }  # alias of test
test-pyoldest = { features = ["test", "py-oldest"], no-default-feature = true }
lint = ["lint", "default"]
build = { features = ["build"], no-default-feature = true }
tools = { features = ["tools"], no-default-feature = true }
